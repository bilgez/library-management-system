<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Kütüphane{% endblock %} — Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="topnav">
  <div class="wrap nav-inner">
    <a href="{{ url_for('catalog') }}" class="brand">
      <span class="brand-mark">§</span>
      <span>Archive <em>Library</em></span>
    </a>
    <div class="nav-links">
      <a href="{{ url_for('catalog') }}" class="{{ 'active' if request.endpoint == 'catalog' }}">Katalog</a>
      <a href="{{ url_for('loans') }}" class="{{ 'active' if request.endpoint == 'loans' }}">Ödünç Kayıtları</a>
    </div>
  </div>
</nav>

<main class="wrap page">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-stack">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap">Library Management System — Bilge Zerda Keklik </div>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
